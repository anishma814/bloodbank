<div class="auth-container">
  <h2>Register</h2>

  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" [(ngModel)]="username" required minlength="3" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="email" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="password" required minlength="6" />
    </div>

    <div class="form-group">
      <label>Register as</label>
      <select name="role" [(ngModel)]="role" required>
        <option value="donor">Donor</option>
        <option value="receiver">Receiver</option>
      </select>
    </div>

    <button type="submit" [disabled]="!registerForm.valid">Register</button>
  </form>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  <p *ngIf="successMessage" class="success">{{ successMessage }}</p>

  <p>Already have an account? <a routerLink="/login">Login here</a></p>
</div>
